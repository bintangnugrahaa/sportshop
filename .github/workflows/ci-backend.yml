name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --warnaserror

      - name: Verify code formatting
        run: dotnet format --verify-no-changes

      - name: Run tests with coverage
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Generate Code Coverage Report
        if: always()
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          if [ -d "TestResults" ] && compgen -G "TestResults/**/coverage.cobertura.xml" > /dev/null; then
            reportgenerator \
              -reports:"TestResults/**/coverage.cobertura.xml" \
              -targetdir:"TestResults/CoverageReport" \
              -reporttypes:"MarkdownSummaryGithub;TextSummary" || true
            if [ -f "TestResults/CoverageReport/Summary.txt" ]; then
              cat TestResults/CoverageReport/Summary.txt
            fi
            if [ -f "TestResults/CoverageReport/SummaryGithub.md" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
              cat TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No test coverage xml files found to process."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore
